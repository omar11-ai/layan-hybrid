name: Deploy to Firebase Hosting

# The demo has to be reachable from a browser anywhere in the world, and it
# has to keep up with the repository. This builds the app and publishes it to
# Firebase Hosting on every push to main.
#
# The one thing it needs is a Firebase service account, stored as the
# FIREBASE_SERVICE_ACCOUNT repository secret. Everything else is standard.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hosting
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npx vite build

      - name: Check the Firebase credentials are present
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not set"
            exit 1
          fi

      - name: Publish
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          firebaseToken: ${{ secrets.FIREBASE_TOKEN }}
          source: dist
          repoToken: ${{ secrets.GITHUB_TOKEN }}
